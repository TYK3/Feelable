name: Deploy to Hugging Face
# Every push to main uploads the repo to your Hugging Face Space, which rebuilds the live app.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   Secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   Variable HF_SPACE  = your space id, e.g.  your-hf-username/feelable
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install huggingface_hub
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path=".",
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA','')[:7]} from GitHub",
              ignore_patterns=[".git/*", ".github/*", ".devcontainer/*", "web/node_modules/*", "web/dist/*",
                               "backend/data/*", "qa/artifacts/*", "**/__pycache__/*", "**/.pytest_cache/*", "*.zip"],
          )
          print("Uploaded to https://huggingface.co/spaces/" + os.environ["HF_SPACE"])
          PY
