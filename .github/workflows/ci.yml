name: Tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Fonts used by the vision tests
        run: sudo apt-get update && sudo apt-get install -y fonts-inter fonts-dejavu-core libgl1 libglib2.0-0
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -m pytest -q
      - name: Web typecheck + build
        run: |
          cd web && npm ci && npx tsc -b --noEmit && npm run build
